# Faturamento da funilaria (departamento 410), series 03 e 08.
#
# Reproduz a consulta que a equipe roda hoje no Apollo e acrescenta o que ela
# nao dava: o historico mes a mes, a nota que compoe o total e as outras areas
# para comparar.
name: faturamento-funilaria
title: Faturamento-Funilaria
description: >-
  Faturamento liquido das notas de servico da funilaria (departamento 410),
  separado por serie -- 03 e 08. Fonte: modelo gold 'faturamento_notas'
  (FAT_MOVIMENTO_CAPA + GER_REVENDA, ERP Linx). Notas canceladas ficam de fora.

formats:
  cnpj: texto
  numero_nota_fiscal: texto
  total_liquido_serie_03: moeda
  total_liquido_serie_08: moeda
  total_liquido: moeda
  total_nota: moeda
  valor_liquido: moeda

sheets:
  - name: Mes atual
    description: O numero da consulta do Apollo -- por filial, no mes corrente.
    sql: |
      SELECT empresa,
             revenda,
             filial,
             cnpj,
             departamento,
             coalesce(sum(valor_liquido) FILTER (WHERE serie = '03'), 0)        AS total_liquido_serie_03,
             coalesce(sum(valor_liquido) FILTER (WHERE serie = '08'), 0)        AS total_liquido_serie_08,
             coalesce(sum(valor_liquido) FILTER (WHERE serie IN ('03','08')), 0) AS total_liquido,
             count(*)           FILTER (WHERE serie IN ('03','08')) AS qtd_notas
        FROM faturamento_notas
       WHERE departamento = 410
         AND competencia = date_trunc('month', current_date)
       GROUP BY empresa, revenda, filial, cnpj, departamento
       ORDER BY empresa, revenda
    totals: [total_liquido_serie_03, total_liquido_serie_08, total_liquido, qtd_notas]

  - name: Ultimos 12 meses
    description: Evolucao mensal da funilaria, todas as filiais somadas.
    sql: |
      SELECT competencia,
             coalesce(sum(valor_liquido) FILTER (WHERE serie = '03'), 0)        AS total_liquido_serie_03,
             coalesce(sum(valor_liquido) FILTER (WHERE serie = '08'), 0)        AS total_liquido_serie_08,
             coalesce(sum(valor_liquido) FILTER (WHERE serie IN ('03','08')), 0) AS total_liquido,
             count(*)           FILTER (WHERE serie IN ('03','08')) AS qtd_notas
        FROM faturamento_notas
       WHERE departamento = 410
         AND competencia >= date_trunc('month', current_date) - INTERVAL 11 MONTH
       GROUP BY competencia
       ORDER BY competencia DESC
    totals: [total_liquido_serie_03, total_liquido_serie_08, total_liquido, qtd_notas]

  - name: Notas do mes
    description: Uma linha por nota -- e o que soma no total da primeira aba.
    sql: |
      SELECT data, filial, numero_nota_fiscal, serie, tipo_transacao,
             total_nota, valor_liquido,
             total_nota - valor_liquido AS deducoes
        FROM faturamento_notas
       WHERE departamento = 410
         AND serie IN ('03','08')
         AND competencia = date_trunc('month', current_date)
       ORDER BY data DESC, numero_nota_fiscal
    totals: [total_nota, valor_liquido, deducoes]
    formats:
      deducoes: moeda
    highlights:
      - when: valor_liquido <= 0
        style: amarelo

  - name: Todos os departamentos
    description: A funilaria ao lado das demais areas, no mes corrente.
    sql: |
      SELECT departamento,
             coalesce(sum(valor_liquido) FILTER (WHERE serie = '03'), 0)        AS total_liquido_serie_03,
             coalesce(sum(valor_liquido) FILTER (WHERE serie = '08'), 0)        AS total_liquido_serie_08,
             coalesce(sum(valor_liquido) FILTER (WHERE serie IN ('03','08')), 0) AS total_liquido
        FROM faturamento_notas
       WHERE competencia = date_trunc('month', current_date)
       GROUP BY departamento
       ORDER BY total_liquido DESC
    totals: [total_liquido_serie_03, total_liquido_serie_08, total_liquido]
    highlights:
      - when: departamento = 410
        style: azul
