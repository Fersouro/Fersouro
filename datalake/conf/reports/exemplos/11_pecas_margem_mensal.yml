# Pecas - Margem mes a mes dentro do periodo escolhido.
name: pecas-margem-mensal
title: Pecas - Margem por mes
description: >-
  A mesma margem, consolidada por mes dentro do periodo -- para comparar meses
  sem abrir um relatorio por vez.

parameters:
  - name: data_inicial
    label: Data inicial
    type: data
    default: inicio-do-mes
  - name: data_final
    label: Data final
    type: data
    default: fim-do-mes
  - name: departamento
    label: Departamento
    type: numero
    optional: true

formats:
  venda_total: moeda
  custo: moeda
  lucro: moeda
  devolucao_total: moeda
  lucro_porcentagem: percentual

sheets:
  - name: Por mes
    description: Uma linha por mes, todas as filiais somadas.
    sql: |
      SELECT competencia,
             sum(venda_total)                                          AS venda_total,
             sum(custo)                                                AS custo,
             sum(lucro)                                                AS lucro,
             round(sum(lucro) / nullif(sum(venda_total), 0) * 100, 2)  AS lucro_porcentagem,
             sum(devolucao_total)                                      AS devolucao_total
        FROM margem_pecas
       WHERE data BETWEEN $data_inicial AND $data_final
         AND ($departamento IS NULL OR departamento = $departamento)
       GROUP BY competencia
       ORDER BY competencia DESC
    totals: [venda_total, custo, lucro, devolucao_total]
