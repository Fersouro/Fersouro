# Estoque de pecas: o "Disponivel" da consulta gerencial, em planilha.
#
# Complementa a pagina de Estoque Minimo (que compara com a lista de minimos);
# aqui a pergunta e outra: quanto tem, quanto vale e o que esta zerado.
name: estoque_pecas
title: Estoque de Pecas
description: >-
  Disponivel por peca e revenda (QTD_CONTABIL do ERP), com o valor parado em
  estoque. Fonte: modelo gold 'estoque_pecas'. Nao usa a lista de minimos --
  para o que precisa comprar, veja a pagina de Estoque Minimo.

formats:
  disponivel: numero
  reservado: numero
  pedido: numero
  preco: moeda
  valor_estoque: moeda

sheets:
  - name: Resumo por revenda
    description: Quantos itens tem saldo, quantos estao zerados e quanto vale o estoque.
    sql: |
      SELECT revenda,
             count(*)                                          AS itens_cadastrados,
             count(*) FILTER (WHERE disponivel > 0)            AS itens_com_saldo,
             count(*) FILTER (WHERE disponivel <= 0)           AS itens_zerados,
             sum(disponivel)                                   AS disponivel,
             sum(disponivel * coalesce(preco, 0))              AS valor_estoque
        FROM estoque_pecas
       GROUP BY revenda
       ORDER BY revenda
    totals: [itens_cadastrados, itens_com_saldo, itens_zerados, valor_estoque]

  - name: Maior valor parado
    description: As 500 pecas que mais prendem dinheiro no estoque.
    sql: |
      SELECT revenda, codigo, descricao, marca, disponivel, reservado, preco,
             disponivel * coalesce(preco, 0) AS valor_estoque
        FROM estoque_pecas
       WHERE disponivel > 0
       ORDER BY valor_estoque DESC
       LIMIT 500
    totals: [valor_estoque]

  - name: Zerados com reserva
    description: Peca sem saldo que alguem ja reservou ou pediu -- venda travada.
    sql: |
      SELECT revenda, codigo, descricao, marca, disponivel, reservado, pedido, preco
        FROM estoque_pecas
       WHERE disponivel <= 0 AND (reservado > 0 OR pedido > 0)
       ORDER BY reservado DESC, pedido DESC
    highlights:
      - when: disponivel <= 0
        style: vermelho
        scope: disponivel
