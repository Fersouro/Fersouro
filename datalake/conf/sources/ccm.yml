# Fonte CCM -- Linx DMS, schema CNP do banco GRUPOTERRASUL.
#
# Comecando por uma tabela so, de proposito: com ~4 mil linhas ela carrega em
# segundos e prova o caminho inteiro (bronze -> silver -> gold -> Power BI)
# antes de mexer em volume grande. As demais entram depois, uma decisao por vez.
#
#   datalake run -s ccm            carrega e publica
#   datalake state                 mostra o que entrou
name: ccm
type: oracle

connection:
  dsn: ${ORACLE_CCM_DSN}
  user: ${ORACLE_CCM_USER}
  password: ${ORACLE_CCM_PASSWORD}
  thick_mode: false
  tcp_connect_timeout: 15

defaults:
  schema: CNP
  batch_rows: 50000

tables:
  # Estoque de veiculos. ~4.322 linhas: recarregar tudo custa segundos, entao
  # nao vale a complexidade de carga incremental aqui.
  - name: VEI_VEICULO
    load_mode: full

    # Fotos em LONG_RAW. Sem excluir, cada carga arrasta os binarios pela rede
    # e incha a bronze -- e nenhum deles serve para relatorio.
    exclude_columns:
      - FOTO_EXTRA_1
      - FOTO_EXTRA_2
      - FOTO_CHASSI

    quality:
      row_count_min: 1
