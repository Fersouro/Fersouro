[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake"
version = "0.1.0"
description = "Datalake local (arquitetura medalhao) com ingestao Oracle, DuckDB e Parquet"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fernando de Souza Roquete" }]
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "oracledb>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
datalake = "datalake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
